<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订单管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-deep: #F7F8FA;
  --bg-primary: #FFFFFF;
  --bg-card: #FFFFFF;
  --bg-elevated: #F7F8FA;
  --bg-hover: #F4F1FF;
  --bg-input: #F7F8FA;
  --border-subtle: #E4E7ED;
  --border-medium: #DCDFE6;
  --border-strong: #C0C4CC;
  --text-primary: #303133;
  --text-secondary: #606266;
  --text-muted: #C0C4CC;
  --accent: #7B61FF;
  --accent-soft: #F4F1FF;
  --green: #10b981;
  --red: #ef4444;
  --blue: #4078FF;
  --orange: #FF9933;
  --btn-primary: #425BE0;
  --btn-export: #FF9933;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --shadow-card: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.03);
  --font-display: 'Outfit', 'Noto Sans SC', sans-serif;
  --font-body: 'Noto Sans SC', 'Outfit', sans-serif;
  --font-mono: 'DM Mono', monospace;
}

html { font-size: 14px; }
body {
  font-family: var(--font-body);
  background: var(--bg-deep);
  color: var(--text-primary);
  min-height: 100vh;
}

.app { position: relative; z-index: 1; }

/* Topbar */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 28px;
  background: #fff;
  border-bottom: 1px solid var(--border-subtle);
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-left { display: flex; align-items: center; gap: 14px; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon {
  width: 30px; height: 30px;
  background: #7B61FF;
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: #fff;
  font-family: var(--font-display);
}
.logo-text { font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--text-primary); }
.logo-divider { width: 1px; height: 20px; background: var(--border-medium); }
.page-title { font-size: 13px; color: var(--text-muted); }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.topbar-badge { padding: 3px 9px; background: #F4F1FF; color: #7B61FF; border-radius: 16px; font-size: 11px; font-weight: 500; font-family: var(--font-mono); }
.topbar-avatar { width: 30px; height: 30px; border-radius: 50%; background: #7B61FF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #fff; cursor: pointer; }

/* Main */
.main { padding: 20px 28px 40px; max-width: 1400px; margin: 0 auto; }

/* Filter Section */
.filter-section {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 18px 22px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-card);
}
.filter-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.filter-title {
  display: flex; align-items: center; gap: 7px;
  font-size: 12px; font-weight: 600; color: var(--text-secondary);
  letter-spacing: 0.04em; text-transform: uppercase;
}
.filter-title svg { width: 15px; height: 15px; color: #7B61FF; }
.filter-reset { font-size: 12px; color: var(--text-muted); cursor: pointer; background: none; border: none; font-family: var(--font-body); transition: color 0.2s; }
.filter-reset:hover { color: #7B61FF; }
.filter-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.filter-group { display: flex; flex-direction: column; gap: 5px; }
.filter-label { font-size: 11px; color: var(--text-muted); font-weight: 500; }
.filter-input, .filter-select {
  height: 36px; background: var(--bg-input); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm); padding: 0 12px; color: var(--text-primary);
  font-size: 12px; font-family: var(--font-body); outline: none; width: 100%;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.filter-input::placeholder { color: var(--text-muted); }
.filter-input:focus, .filter-select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.filter-select {
  cursor: pointer; appearance: none;
  background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23C0C4CC' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat; background-position: right 10px center; padding-right: 28px;
}
.filter-actions { display: flex; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-subtle); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  height: 34px; padding: 0 16px; border-radius: var(--radius-sm);
  font-size: 12px; font-weight: 500; font-family: var(--font-body);
  cursor: pointer; transition: all 0.2s; border: none;
}
.btn svg { width: 14px; height: 14px; }
.btn-primary { background: #425BE0; color: #fff; box-shadow: 0 2px 6px rgba(66,91,224,0.2); }
.btn-primary:hover { box-shadow: 0 4px 12px rgba(66,91,224,0.3); transform: translateY(-1px); }
.btn-export { background: #FF9933; color: #fff; box-shadow: 0 2px 6px rgba(255,153,51,0.2); }
.btn-export:hover { box-shadow: 0 4px 12px rgba(255,153,51,0.3); transform: translateY(-1px); }
.btn-secondary { background: #fff; color: var(--text-secondary); border: 1px solid var(--border-medium); }
.btn-secondary:hover { background: #F4F1FF; color: #7B61FF; border-color: rgba(123,97,255,0.3); }

/* Table Section */
.table-section {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-card);
}
.table-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 22px; border-bottom: 1px solid var(--border-subtle);
}
.table-toolbar-left { display: flex; align-items: center; gap: 10px; }
.table-toolbar-right { display: flex; align-items: center; gap: 8px; }
.table-count { font-size: 12px; color: var(--text-muted); }
.table-count span { color: #7B61FF; font-weight: 600; font-family: var(--font-mono); }

.table-scroll { overflow-x: auto; }

/* Order Table */
.order-table { width: 100%; border-collapse: collapse; }
.order-table thead th {
  padding: 11px 16px; text-align: left; font-size: 11px; font-weight: 600;
  color: var(--text-muted); letter-spacing: 0.04em; text-transform: uppercase;
  border-bottom: 1px solid var(--border-subtle); background: #F7F8FA;
  white-space: nowrap;
}

.order-row { cursor: pointer; transition: background 0.15s; }
.order-row:hover { background: var(--bg-hover); }
.order-row td {
  padding: 12px 16px; font-size: 13px; color: var(--text-primary);
  border-bottom: 1px solid var(--border-subtle); white-space: nowrap;
}
.expand-btn {
  width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center;
  border: none; background: none; cursor: pointer; color: var(--text-muted);
  transition: all 0.2s; border-radius: 4px; padding: 0;
}
.expand-btn:hover { background: #F4F1FF; color: #7B61FF; }
.expand-btn svg { width: 13px; height: 13px; transition: transform 0.2s; }
.order-row.expanded .expand-btn svg { transform: rotate(90deg); }

.expand-toggle-btn {
  width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
  border: none; background: none; cursor: pointer; color: var(--text-muted);
  transition: all 0.2s; border-radius: 4px; padding: 0;
}
.expand-toggle-btn:hover { background: #F4F1FF; color: #7B61FF; }
.expand-toggle-btn svg { width: 16px; height: 16px; transition: transform 0.2s; }

.order-id { font-family: var(--font-mono); font-weight: 500; font-size: 12px; color: var(--text-primary); }
.order-date { font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary); }
.order-num { font-family: var(--font-mono); font-weight: 500; }

.suborder-row { display: none; }
.suborder-row.visible { display: table-row; }
.suborder-row td { padding: 0; border-bottom: 1px solid var(--border-subtle); background: #F7F8FA; }
.suborder-container { padding: 10px 16px 10px 52px; }
.suborder-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border-subtle); }
.suborder-table th {
  padding: 9px 12px; text-align: left; font-size: 10px; font-weight: 600;
  color: var(--text-muted); letter-spacing: 0.04em; text-transform: uppercase;
  background: #F7F8FA; border-bottom: 1px solid var(--border-subtle);
}
.suborder-table td { padding: 9px 12px; font-size: 12px; color: var(--text-primary); border-bottom: 1px solid var(--border-subtle); }
.suborder-table tr:last-child td { border-bottom: none; }

.flag { display: inline-flex; align-items: center; gap: 3px; padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: 500; }
.flag-urgent { background: #FEE2E2; color: #DC2626; }
.flag-note { background: #FEF3C7; color: #D97706; }
.flag-vip { background: #F4F1FF; color: #7B61FF; }

.sub-action-btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; border: none; border-radius: 4px;
  font-size: 11px; font-weight: 500; cursor: pointer; transition: all 0.2s;
  background: #D1FAE5; color: #059669;
}
.sub-action-btn:hover { background: #A7F3D0; }
.sub-action-btn.split {
  background: #F4F1FF; color: #7B61FF;
}
.sub-action-btn.split:hover { background: #E9E5FB; }
.sub-action-btn.sync {
  background: #DBEAFE; color: #2563EB;
}
.sub-action-btn.sync:hover { background: #BFDBFE; }
.sub-action-group { display: flex; gap: 6px; justify-content: flex-end; }

.suborder-num-link {
  font-family: var(--font-mono); font-weight: 600; font-size: 12px;
  color: #4078FF; cursor: pointer; padding: 2px 6px; border-radius: 4px;
  transition: all 0.2s;
}
.suborder-num-link:hover { background: #F4F1FF; text-decoration: underline; }

/* Pagination */
.pagination {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 22px; border-top: 1px solid var(--border-subtle);
}
.page-info { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); }
.page-controls { display: flex; align-items: center; gap: 3px; }
.page-btn {
  width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm); background: none; border: 1px solid transparent;
  color: var(--text-muted); font-size: 12px; font-family: var(--font-mono);
  font-weight: 500; cursor: pointer; transition: all 0.2s;
}
.page-btn:hover { background: #F4F1FF; border-color: rgba(123,97,255,0.2); color: #7B61FF; }
.page-btn.active { background: #F4F1FF; border-color: rgba(123,97,255,0.25); color: #7B61FF; }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(30,30,46,0.45);
  backdrop-filter: blur(6px); z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; visibility: hidden; transition: opacity 0.25s, visibility 0.25s;
}
.modal-overlay.open { opacity: 1; visibility: visible; }
.modal {
  background: #fff; border-radius: 16px; width: 500px; max-width: 92vw; max-height: 90vh;
  display: flex; flex-direction: column;
  box-shadow: 0 24px 80px rgba(0,0,0,0.15);
  transform: translateY(20px) scale(0.97); transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
}
.modal-overlay.open .modal { transform: translateY(0) scale(1); }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 22px 14px; border-bottom: 1px solid var(--border-subtle); flex-shrink: 0;
}
.modal-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; color: var(--text-primary); }
.modal-body { padding: 18px 22px; overflow-y: auto; flex: 1; }
.modal-footer { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 14px 22px; border-top: 1px solid var(--border-subtle); flex-shrink: 0; }

.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px);
  background: #1e1e2e; color: #fff; padding: 9px 20px; border-radius: 8px;
  font-size: 12px; font-weight: 500; font-family: var(--font-body);
  z-index: 2000; opacity: 0; pointer-events: none;
  transition: opacity 0.3s, transform 0.3s cubic-bezier(0.22,1,0.36,1);
  box-shadow: 0 8px 30px rgba(0,0,0,0.2);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.animate-in { animation: fadeUp 0.4s cubic-bezier(0.22,1,0.36,1) both; }
.delay-1 { animation-delay: 0.05s; } .delay-2 { animation-delay: 0.1s; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #D0D0E0; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #B0B0C0; }
</style>
</head>
<body>
<div class="app">

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo">
        <div class="logo-icon">O</div>
        <span class="logo-text">OrderOS</span>
      </div>
      <div class="logo-divider"></div>
      <span class="page-title">订单管理</span>
    </div>
    <div class="topbar-right">
      <span class="topbar-badge">v1.0.0</span>
      <div class="topbar-avatar">谢</div>
    </div>
  </header>

  <main class="main">

    <!-- FILTERS -->
    <div class="filter-section animate-in delay-1">
      <div class="filter-header">
        <div class="filter-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
          筛选条件
        </div>
        <button class="filter-reset" onclick="resetFilters()">重置全部</button>
      </div>
      <div class="filter-grid">
        <div class="filter-group">
          <label class="filter-label">Shopify订单号</label>
          <input type="text" class="filter-input" placeholder="输入订单号搜索..." id="filterOrderId">
        </div>
        <div class="filter-group">
          <label class="filter-label">渠道</label>
          <select class="filter-select" id="filterChannel">
            <option value="">全部渠道</option>
            <option value="online">在线商店</option>
            <option value="pos">POS 线下门店</option>
            <option value="draft">草稿订单</option>
            <option value="iphone">iPhone 应用</option>
            <option value="android">Android 应用</option>
            <option value="mobile">手机app</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label">店铺</label>
          <select class="filter-select" id="filterStore">
            <option value="">全部店铺</option>
            <option value="store001">美国站旗舰店</option>
            <option value="store002">欧洲站专卖店</option>
            <option value="store003">日本站精选店</option>
            <option value="store004">东南亚站店铺</option>
            <option value="store005">加拿大站店铺</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label">支付状态</label>
          <select class="filter-select" id="filterPayStatus">
            <option value="">全部</option>
            <option value="paid">已支付</option>
            <option value="unpaid">未支付</option>
            <option value="refunded">已退款</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label">发货状态</label>
          <select class="filter-select" id="filterShipStatus">
            <option value="">全部</option>
            <option value="pending">待发货</option>
            <option value="partial">部分发货</option>
            <option value="shipped">已发货</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label">创建日期</label>
          <input type="date" class="filter-input" id="filterDateStart">
        </div>
        <div class="filter-group">
          <label class="filter-label">至</label>
          <input type="date" class="filter-input" id="filterDateEnd">
        </div>
      </div>
      <div class="filter-actions">
        <button class="btn btn-primary" onclick="applyFilters()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          查询
        </button>
        <button class="btn btn-secondary" onclick="resetFilters()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
          重置
        </button>
      </div>
    </div>

    <!-- TABLE -->
    <div class="table-section animate-in delay-2">
      <div class="table-toolbar">
        <div class="table-toolbar-left">
          <span class="table-count">共 <span id="totalCount">10</span> 个订单</span>
        </div>
        <div class="table-toolbar-right">
          <button class="btn btn-primary" onclick="batchSyncWms()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
            批量同步易仓
          </button>
          <button class="btn btn-export" onclick="openBatchImport()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            批量导入标发
          </button>
          <button class="btn btn-secondary" onclick="exportData()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            导出
          </button>
        </div>
      </div>

      <div class="table-scroll">
        <table class="order-table">
          <thead>
            <tr>
              <th style="width: 36px;">
                <button class="expand-toggle-btn" id="expandToggleBtn" onclick="toggleAllSubOrders()" title="展开/折叠子订单">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
              </th>
              <th>Shopify订单号</th>
              <th>子订单数</th>
              <th>创建日期</th>
              <th>渠道</th>
              <th>店铺</th>
              <th>支付状态</th>
              <th>发货状态</th>
              <th>商品数</th>
              <th>标记</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="orderTableBody">
          </tbody>
        </table>
      </div>

      <div class="pagination">
        <div class="page-info">显示 1-10 / 共 10 条</div>
        <div class="page-controls">
          <button class="page-btn" title="上一页"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg></button>
          <button class="page-btn active">1</button>
          <button class="page-btn" title="下一页"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg></button>
        </div>
      </div>
    </div>

  </main>

  <div class="toast" id="toast"></div>

</div>

<script>
const orders = [
  { id: 'SHOP-20260623-001', date: '2026-06-23', channel: 'online', store: 'store001', payStatus: 'paid', shipStatus: 'partial', productCount: 8, subCount: 3, flags: ['vip'] },
  { id: 'SHOP-20260623-002', date: '2026-06-23', channel: 'online', store: 'store001', payStatus: 'paid', shipStatus: 'shipped', productCount: 3, subCount: 2, flags: [] },
  { id: 'SHOP-20260623-003', date: '2026-06-23', channel: 'pos', store: 'store002', payStatus: 'paid', shipStatus: 'pending', productCount: 2, subCount: 1, flags: ['urgent'] },
  { id: 'SHOP-20260623-004', date: '2026-06-23', channel: 'draft', store: 'store001', payStatus: 'unpaid', shipStatus: 'pending', productCount: 1, subCount: 0, flags: [] },
  { id: 'SHOP-20260623-005', date: '2026-06-23', channel: 'iphone', store: 'store003', payStatus: 'paid', shipStatus: 'partial', productCount: 6, subCount: 4, flags: [] },
  { id: 'SHOP-20260623-006', date: '2026-06-23', channel: 'android', store: 'store004', payStatus: 'paid', shipStatus: 'shipped', productCount: 2, subCount: 1, flags: ['note'] },

  { id: 'SHOP-20260623-009', date: '2026-06-24', channel: 'pos', store: 'store003', payStatus: 'refunded', shipStatus: 'shipped', productCount: 2, subCount: 1, flags: [] },

];

function init() {
  renderOrderTable();
}

function renderOrderTable() {
  const tbody = document.getElementById('orderTableBody');
  tbody.innerHTML = orders.map((order, idx) => `
    <tr class="order-row">
      <td><button class="expand-btn" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 6 15 12 9 18"/></svg></button></td>
      <td><span class="order-id">${order.id}</span></td>
      <td><span class="order-num">${order.subCount}</span></td>
      <td><span class="order-date">${order.date}</span></td>
      <td>${getChannelName(order.channel)}</td>
      <td>${getStoreName(order.store)}</td>
      <td>${getPayStatusBadge(order.payStatus)}</td>
      <td>${getShipStatusBadge(order.shipStatus)}</td>
      <td><span class="order-num">${order.productCount}</span></td>
      <td>${getFlagsBadges(order.flags)}</td>
      <td><button class="btn btn-secondary" onclick="showToast('查看操作日志')">日志</button></td>
    </tr>
  `).join('');
}

function getChannelName(ch) {
  const map = { online: '在线商店', pos: 'POS 线下门店', draft: '草稿订单', iphone: 'iPhone 应用', android: 'Android 应用', mobile: '手机app' };
  return map[ch] || ch;
}

function getStoreName(st) {
  const map = { store001: '美国站旗舰店', store002: '欧洲站专卖店', store003: '日本站精选店', store004: '东南亚站店铺', store005: '加拿大站店铺' };
  return map[st] || st;
}

function getPayStatusBadge(st) {
  const map = { paid: '已支付', unpaid: '未支付', refunded: '已退款' };
  const colors = { paid: '#D1FAE5', unpaid: '#FEF3C7', refunded: '#FEE2E2' };
  const textColors = { paid: '#059669', unpaid: '#D97706', refunded: '#DC2626' };
  return `<span style="background:${colors[st]};color:${textColors[st]};padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;">${map[st]}</span>`;
}

function getShipStatusBadge(st) {
  const map = { shipped: '已发货', pending: '待发货', partial: '部分发货' };
  const colors = { shipped: '#D1FAE5', pending: '#FEF3C7', partial: '#DBEAFE' };
  const textColors = { shipped: '#059669', pending: '#D97706', partial: '#2563EB' };
  return `<span style="background:${colors[st]};color:${textColors[st]};padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;">${map[st]}</span>`;
}

function getFlagsBadges(flags) {
  return flags.map(f => {
    const map = { vip: 'VIP', urgent: '紧急', note: '备注' };
    const classes = { vip: 'flag-vip', urgent: 'flag-urgent', note: 'flag-note' };
    return `<span class="flag ${classes[f]}">${map[f]}</span>`;
  }).join('');
}

function toggleAllSubOrders() { showToast('切换展开/折叠'); }
function applyFilters() { showToast('查询成功！'); }
function resetFilters() { showToast('筛选已重置'); }
function batchSyncWms() { showToast('批量同步易仓已启动...'); }
function openBatchImport() { showToast('打开批量导入窗口'); }
function exportData() { showToast('数据导出成功！'); }

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
