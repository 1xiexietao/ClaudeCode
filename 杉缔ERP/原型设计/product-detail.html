<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订单详情 — OrderOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-deep: #f3f4f8;
  --bg-primary: #ffffff;
  --bg-card: #ffffff;
  --bg-elevated: #f7f7fb;
  --bg-input: #f5f5fa;
  --border-subtle: #e8e8f0;
  --border-medium: #d8d8e4;
  --text-primary: #1e1e2e;
  --text-secondary: #6b6b80;
  --text-muted: #9e9eb5;
  --accent: #7c3aed;
  --accent-soft: rgba(124,58,237,0.08);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --shadow-card: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.03);
  --font-display: 'Outfit', 'Noto Sans SC', sans-serif;
  --font-body: 'Noto Sans SC', 'Outfit', sans-serif;
  --font-mono: 'DM Mono', monospace;
}

html { font-size: 14px; }
body {
  font-family: var(--font-body);
  background: var(--bg-deep);
  color: var(--text-primary);
  min-height: 100vh;
}
body::before {
  content: '';
  position: fixed;
  top: -20%; right: -10%;
  width: 50vw; height: 50vw;
  background: radial-gradient(ellipse, rgba(124,58,237,0.05) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* === TOPBAR === */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 32px;
  background: rgba(255,255,255,0.85);
  border-bottom: 1px solid var(--border-subtle);
  backdrop-filter: blur(16px);
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-left { display: flex; align-items: center; gap: 16px; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, #7c3aed, #a855f7);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; color: #fff;
  font-family: var(--font-display);
  box-shadow: 0 2px 8px rgba(124,58,237,0.3);
}
.logo-text { font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: -0.02em; }
.logo-divider { width: 1px; height: 24px; background: var(--border-medium); }
.breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); }
.breadcrumb a { color: var(--text-muted); text-decoration: none; transition: color 0.15s; }
.breadcrumb a:hover { color: var(--accent); }
.breadcrumb .sep { font-size: 11px; }
.breadcrumb .current { color: var(--text-primary); font-weight: 500; }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.topbar-badge {
  padding: 4px 10px;
  background: #f5f3ff; color: #7c3aed;
  border-radius: 20px; font-size: 12px; font-weight: 500;
  font-family: var(--font-mono);
}
.topbar-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, #7c3aed, #a855f7);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600; color: #fff; cursor: pointer;
}

/* === LAYOUT === */
.main { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 28px 32px 60px; }

/* === BACK BAR === */
.back-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}
.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: none; border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm); padding: 8px 16px;
  font-size: 13px; font-weight: 500; color: var(--text-secondary);
  cursor: pointer; transition: all 0.2s; font-family: var(--font-body);
}
.back-btn:hover { background: #fff; color: #7c3aed; border-color: rgba(124,58,237,0.3); }
.back-btn svg { width: 15px; height: 15px; }

.back-actions { display: flex; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 38px; padding: 0 18px;
  border-radius: var(--radius-sm); font-size: 13px; font-weight: 500;
  font-family: var(--font-body); cursor: pointer;
  transition: all 0.2s; border: none;
}
.btn svg { width: 15px; height: 15px; }
.btn-primary {
  background: linear-gradient(135deg, #7c3aed, #a855f7);
  color: #fff;
  box-shadow: 0 2px 8px rgba(124,58,237,0.25);
}
.btn-primary:hover { box-shadow: 0 4px 16px rgba(124,58,237,0.35); transform: translateY(-1px); }
.btn-secondary {
  background: #fff; color: var(--text-secondary);
  border: 1px solid var(--border-medium);
}
.btn-secondary:hover { background: #f5f3ff; color: #7c3aed; border-color: rgba(124,58,237,0.3); }

/* === CARDS === */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}

/* === HERO === */
.hero-card {
  margin-bottom: 20px;
  padding: 32px;
  display: flex;
  gap: 28px;
  align-items: center;
  animation: fadeUp 0.5s cubic-bezier(0.22,1,0.36,1) both;
}
.hero-icon {
  width: 88px; height: 88px;
  border-radius: 20px;
  background: linear-gradient(135deg, #f5f3ff, #ede9fe);
  border: 1px solid #e9e5ff;
  display: flex; align-items: center; justify-content: center;
  font-size: 44px; flex-shrink: 0;
}
.hero-info { flex: 1; }
.hero-name {
  font-family: var(--font-display);
  font-size: 26px; font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}
.hero-meta {
  display: flex; align-items: center; gap: 12px;
  flex-wrap: wrap;
}
.hero-sku {
  font-size: 12px; color: var(--text-muted);
  font-family: var(--font-mono);
  background: var(--bg-input); padding: 3px 10px;
  border-radius: 5px;
}
.hero-amount {
  font-family: var(--font-mono);
  font-size: 28px; font-weight: 700;
  color: #7c3aed;
  letter-spacing: -0.03em;
  text-align: right;
  animation: fadeUp 0.5s 0.1s cubic-bezier(0.22,1,0.36,1) both;
}
.hero-amount-label {
  font-size: 11px; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.06em;
  font-weight: 600; margin-bottom: 4px;
  text-align: right;
}

/* === GRID 3-col === */
.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}
.info-grid .card {
  padding: 24px;
  animation: fadeUp 0.5s 0.15s cubic-bezier(0.22,1,0.36,1) both;
}
.info-grid .card:nth-child(2) { animation-delay: 0.2s; }
.info-grid .card:nth-child(3) { animation-delay: 0.25s; }
.card-label {
  font-size: 11px; font-weight: 600;
  color: var(--text-muted); text-transform: uppercase;
  letter-spacing: 0.06em; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.card-label svg { width: 14px; height: 14px; color: #7c3aed; }

/* detail rows */
.detail-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-subtle);
}
.detail-row:last-child { border-bottom: none; }
.detail-row-label { font-size: 13px; color: var(--text-secondary); }
.detail-row-value { font-size: 13px; font-weight: 500; }

/* status & payment badges */
.status {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
}
.status-dot { width: 6px; height: 6px; border-radius: 50%; }
.status-pending { background: #fef3c7; color: #d97706; }
.status-pending .status-dot { background: #f59e0b; }
.status-processing { background: #dbeafe; color: #2563eb; }
.status-processing .status-dot { background: #3b82f6; animation: pulse-dot 2s infinite; }
.status-shipped { background: #ede9fe; color: #7c3aed; }
.status-shipped .status-dot { background: #8b5cf6; }
.status-completed { background: #d1fae5; color: #059669; }
.status-completed .status-dot { background: #10b981; }
.status-cancelled { background: #fee2e2; color: #dc2626; }
.status-cancelled .status-dot { background: #ef4444; }
@keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.payment-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
.payment-tag.paid { color: #10b981; }
.payment-tag.unpaid { color: #9e9eb5; }
.payment-tag.refunded { color: #ef4444; }

/* === TIMELINE === */
.timeline-card {
  padding: 28px;
  margin-bottom: 20px;
  animation: fadeUp 0.5s 0.3s cubic-bezier(0.22,1,0.36,1) both;
}
.timeline {
  position: relative;
  padding: 0;
  display: flex;
  justify-content: space-between;
}
.timeline::before {
  content: '';
  position: absolute;
  top: 15px; left: 15px; right: 15px;
  height: 3px;
  background: var(--border-subtle);
  border-radius: 2px;
  z-index: 0;
}
.timeline-step {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  z-index: 1;
  flex: 1;
}
.timeline-dot {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid var(--border-medium);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  transition: all 0.3s;
  margin-bottom: 10px;
}
.timeline-step.done .timeline-dot {
  background: linear-gradient(135deg, #7c3aed, #a855f7);
  border-color: #7c3aed;
  color: #fff;
  box-shadow: 0 2px 10px rgba(124,58,237,0.25);
}
.timeline-step.active .timeline-dot {
  background: #fff;
  border-color: #7c3aed;
  color: #7c3aed;
  box-shadow: 0 0 0 5px rgba(124,58,237,0.12);
  animation: pulse-ring 2s infinite;
}
@keyframes pulse-ring {
  0%, 100% { box-shadow: 0 0 0 5px rgba(124,58,237,0.12); }
  50% { box-shadow: 0 0 0 8px rgba(124,58,237,0.06); }
}
.timeline-label {
  font-size: 12px; font-weight: 600;
  color: var(--text-primary);
  text-align: center;
}
.timeline-time {
  font-size: 11px; color: var(--text-muted);
  font-family: var(--font-mono);
  margin-top: 2px;
}
.timeline-step:not(.done):not(.active) .timeline-label { color: var(--text-muted); }
.timeline-step:not(.done):not(.active) .timeline-dot { background: var(--bg-input); }

/* === LOG SECTION === */
.log-card {
  padding: 28px;
  animation: fadeUp 0.5s 0.35s cubic-bezier(0.22,1,0.36,1) both;
}
.log-list { display: flex; flex-direction: column; }
.log-entry {
  display: flex; gap: 14px;
  padding: 14px 0;
  border-bottom: 1px solid var(--border-subtle);
}
.log-entry:last-child { border-bottom: none; }
.log-time-col {
  width: 72px; flex-shrink: 0;
  display: flex; flex-direction: column;
  align-items: flex-end; padding-top: 2px;
}
.log-time { font-size: 12px; font-family: var(--font-mono); font-weight: 500; color: var(--text-secondary); }
.log-date { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }
.log-icon-col { width: 30px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; }
.log-icon {
  width: 30px; height: 30px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}
.log-icon.create { background: #d1fae5; }
.log-icon.edit { background: #dbeafe; }
.log-icon.status { background: #ede9fe; }
.log-icon.payment { background: #fef3c7; }
.log-icon.ship { background: #e0e7ff; }
.log-icon.cancel { background: #fee2e2; }
.log-icon.system { background: #f0f0f5; }
.log-content-col { flex: 1; min-width: 0; }
.log-action { font-size: 13px; color: var(--text-primary); line-height: 1.5; }
.log-action strong { font-weight: 600; color: #7c3aed; }
.log-detail { font-size: 12px; color: var(--text-muted); margin-top: 2px; line-height: 1.4; }
.log-user {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; color: var(--text-muted);
  margin-top: 4px; background: var(--bg-input);
  padding: 2px 8px; border-radius: 4px;
}
.log-user-dot { width: 5px; height: 5px; border-radius: 50%; background: #10b981; }

.log-entry { animation: logSlide 0.3s cubic-bezier(0.22,1,0.36,1) both; }
@keyframes logSlide {
  from { opacity: 0; transform: translateX(-8px); }
  to { opacity: 1; transform: translateX(0); }
}

/* === ANIMATIONS === */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

/* === RESPONSIVE === */
@media (max-width: 900px) {
  .info-grid { grid-template-columns: 1fr; }
  .hero-card { flex-direction: column; text-align: center; }
  .hero-amount { text-align: center; }
  .hero-amount-label { text-align: center; }
  .timeline { flex-direction: column; gap: 0; }
  .timeline::before { top: 15px; bottom: 15px; left: 15px; right: auto; width: 3px; height: auto; }
  .timeline-step { flex-direction: row; gap: 12px; padding: 10px 0; }
  .timeline-dot { margin-bottom: 0; }
  .timeline-label, .timeline-time { text-align: left; }
  .main { padding: 20px 16px 40px; }
  .topbar { padding: 12px 16px; }
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #d0d0e0; border-radius: 3px; }
</style>
</head>

const statusMap = {
  pending: {label:'待付款', cls:'status-pending'},
  processing: {label:'处理中', cls:'status-processing'},
  shipped: {label:'已发货', cls:'status-shipped'},
  completed: {label:'已完成', cls:'status-completed'},
  cancelled: {label:'已取消', cls:'status-cancelled'},
};

// ========== INIT ==========
const params = new URLSearchParams(window.location.search);
const orderId = params.get('id');
const order = orders.find(o => o.id === orderId);

if (!order) {
  document.querySelector('.main').innerHTML = `
    <div style="text-align:center;padding:120px 0">
      <div style="font-size:48px;margin-bottom:16px"> </div>
      <div style="font-size:18px;font-weight:600;color:var(--text-primary);margin-bottom:8px">订单不存在</div>
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:24px">请检查链接是否正确</div>
      <a href="order-management.html" class="btn btn-primary" style="text-decoration:none;display:inline-flex">返回订单列表</a>
    </div>`;
} else {
  render(order);
}

function render(o) {
  document.title = o.product + ' — OrderOS';
  document.getElementById('breadcrumbId').textContent = o.id;

  // hero
  document.getElementById('heroIcon').textContent = o.icon;
  document.getElementById('heroName').textContent = o.product;
  document.getElementById('heroSku').textContent = o.sku;
  document.getElementById('heroAmount').textContent = '¥' + o.amount.toLocaleString();

  const s = statusMap[o.status];
  document.getElementById('heroStatus').innerHTML = `<span class="status ${s.cls}"><span class="status-dot"></span>${s.label}</span>`;
  const payCls = o.payment === 'paid' ? 'paid' : o.payment === 'refunded' ? 'refunded' : 'unpaid';
  const payLabel = o.payment === 'paid' ? '已支付' : o.payment === 'refunded' ? '已退款' : '待支付';
  document.getElementById('heroPayment').innerHTML = `<span class="payment-tag ${payCls}">${payLabel}</span>`;

  // info
  document.getElementById('infoId').textContent = o.id;
  document.getElementById('infoDate').textContent = o.date;
  document.getElementById('infoMethod').textContent = o.method;
  document.getElementById('infoCustomer').textContent = o.customer;
  document.getElementById('infoPhone').textContent = o.phone || '—';
  document.getElementById('infoAddr').textContent = o.addr || '—';
  document.getElementById('infoProduct').textContent = o.product;
  document.getElementById('infoSku').textContent = o.sku;
  document.getElementById('infoPrice').textContent = '¥' + o.amount.toLocaleString();

  // timeline
  const tl = document.getElementById('timeline');
  if (o.timeline && o.timeline.length) {
    tl.innerHTML = o.timeline.map(t => `
      <div class="timeline-step ${t.done ? 'done' : ''} ${t.active ? 'active' : ''}">
        <div class="timeline-dot">${t.done ? '✓' : t.active ? '◉' : (t.icon || '·')}</div>
        <div class="timeline-label">${t.text}</div>
        <div class="timeline-time">${t.time}</div>
      </div>
    `).join('');
  }

  // log
  const list = document.getElementById('logList');
  if (o.logs && o.logs.length) {
    list.innerHTML = o.logs.map((log, i) => `
      <div class="log-entry" style="animation-delay:${i * 0.05}s">
        <div class="log-time-col">
          <span class="log-time">${log.time}</span>
          <span class="log-date">${log.date}</span>
        </div>
        <div class="log-icon-col">
          <div class="log-icon ${log.type}">${log.icon}</div>
        </div>
        <div class="log-content-col">
          <div class="log-action">${log.action}</div>
          <div class="log-detail">${log.detail}</div>
          <span class="log-user"><span class="log-user-dot"></span>${log.user}</span>
        </div>
      </div>
    `).join('');
  }
}

function scrollToLog() {
  document.getElementById('logSection').scrollIntoView({ behavior: 'smooth' });
}

function goEdit() {
  window.location.href = 'order-management.html?edit=' + encodeURIComponent(orderId);
}
